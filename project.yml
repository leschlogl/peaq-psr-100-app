name: PeaqRing
options:
  bundleIdPrefix: com.peaqring
  deploymentTarget:
    iOS: '17.0'
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: '5.0'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
targets:
  PeaqRing:
    type: application
    platform: iOS
    sources:
      - PeaqRing
      - Sources/RingProtocol
    info:
      path: PeaqRing/Resources/Info.plist
      properties:
        CFBundleDisplayName: My PEAQ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: Connect to your PEAQ ring to read battery and sync your health history.
        UIBackgroundModes: [bluetooth-central, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.peaqring.refresh]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peaqring.ios
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '0.5.0'
        CURRENT_PROJECT_VERSION: '5'
  PeaqRingTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PeaqRingTests]
    dependencies:
      - target: PeaqRing
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PeaqRingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PeaqRingUITests]
    dependencies:
      - target: PeaqRing
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PeaqRing:
    build:
      targets:
        PeaqRing: all
    test:
      targets: [PeaqRingTests, PeaqRingUITests]
